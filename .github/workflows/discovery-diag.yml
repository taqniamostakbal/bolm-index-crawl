name: Discovery DIAG — HTTP access pattern probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install duckdb only
        run: pip install -q duckdb
      - name: Run probe
        run: python pipeline/diag_http.py
